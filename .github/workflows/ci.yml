name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read  # gitleaks-action lists PR commits

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm testsuite:fetch
      - run: pnpm test

  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start verifier
        run: |
          echo "VERIFIER_SECRET=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - run: docker compose up -d --build verifier
      - name: Wait for verifier
        # The server only listens after the KoSIT configuration is loaded.
        run: |
          for i in $(seq 1 60); do curl -sf localhost:8081/health && exit 0; sleep 2; done
          docker compose logs verifier; exit 1
      - run: pnpm testsuite:fetch
      - run: pnpm verifier:check
      - run: pnpm roundtrip:check
